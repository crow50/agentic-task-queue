# Lint for real bugs (syntax errors, undefined names, unused imports and
# variables), not style. The rule list is explicit so a ruff upgrade cannot
# silently widen what CI checks; ruff 0.16's broader default set reports 42
# style findings in the existing code. Widen `select` on purpose, one family
# at a time, fixing what it finds in the same change.
[lint]
select = ["E4", "E7", "E9", "F"]
