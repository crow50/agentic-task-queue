name: CI

# Runs on pull requests only. It uses no secrets: the job token is read-only
# and is not persisted. Every action is pinned to a full commit SHA, ruff is
# installed with pip --require-hashes, and gitleaks is a checksum-verified
# release binary. Nothing here needs a write token or the privileged
# fork-PR trigger.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime libraries (pinned, hashed)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Compile
        run: python -m py_compile dispatcher.py coordinator_bot.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff (pinned, hashed)
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/ci-requirements.txt
      - name: Ruff
        run: ruff check .

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the PR tip
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner --verbose .
